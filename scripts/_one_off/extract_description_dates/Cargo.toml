[package]
name = "extract_description_dates"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "extract_description_dates"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
indicatif = "0.17"
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
